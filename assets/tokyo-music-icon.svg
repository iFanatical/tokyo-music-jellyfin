<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tokyo-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="48" y="48" width="416" height="416" rx="112"
        fill="url(#tokyo-gradient)" opacity="0.38" filter="url(#glow)"/>
  <rect x="48" y="48" width="416" height="416" rx="112"
        fill="url(#tokyo-gradient)"/>

  <g fill="#0c0e14">
    <rect x="112" y="208" width="42" height="96" rx="21"/>
    <rect x="184" y="144" width="42" height="224" rx="21"/>
    <rect x="256" y="96" width="42" height="320" rx="21"/>
    <rect x="328" y="168" width="42" height="176" rx="21"/>
    <rect x="400" y="224" width="42" height="64" rx="21"/>
  </g>
</svg>
