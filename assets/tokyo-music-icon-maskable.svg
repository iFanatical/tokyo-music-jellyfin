<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed variant for launchers that crop icons to their own shape:
       the mark sits inside the central safe zone on a solid background. -->
  <defs>
    <linearGradient id="tokyo-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#1a1b26"/>
  <g transform="translate(256 256) scale(0.7) translate(-256 -256)">
    <rect x="48" y="48" width="416" height="416" rx="112" fill="url(#tokyo-gradient)"/>
    <g fill="#0c0e14">
      <rect x="112" y="208" width="42" height="96" rx="21"/>
      <rect x="184" y="144" width="42" height="224" rx="21"/>
      <rect x="256" y="96" width="42" height="320" rx="21"/>
      <rect x="328" y="168" width="42" height="176" rx="21"/>
      <rect x="400" y="224" width="42" height="64" rx="21"/>
    </g>
  </g>
</svg>
